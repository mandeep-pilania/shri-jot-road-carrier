<header class="header" [class.header--scrolled]="solid">
  <div class="container header__inner">
    <a routerLink="/" class="header__brand" (click)="closeMobileMenu()">
      <app-logo-mark [size]="40" class="header__logo"></app-logo-mark>
      <span class="header__brand-text">
        <span class="header__company">Shri Jot Road Carrier</span>
        <span class="header__tagline">Daily Full Load &amp; Part Load Transport</span>
      </span>
    </a>

    <nav class="header__nav" aria-label="Primary">
      <a
        *ngFor="let link of navLinks"
        [routerLink]="link.path"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: link.path === '/' }"
        class="header__nav-link"
      >
        {{ link.label }}
      </a>
    </nav>

    <div class="header__actions">
      <a href="tel:+919023424923" class="header__phone">
        <lucide-icon name="phone" [size]="16"></lucide-icon>
        <span>+91 90234 24923</span>
      </a>
      <a routerLink="/login" class="header__login">Login</a>
      <a routerLink="/contact" class="btn btn-primary header__cta">Get a Quote</a>
    </div>

    <button
      type="button"
      class="header__hamburger"
      [class.is-open]="mobileMenuOpen()"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-label="Toggle navigation menu"
    >
      <span></span><span></span><span></span>
    </button>
  </div>

  <nav
    class="header__mobile-nav"
    [class.is-open]="mobileMenuOpen()"
    aria-label="Mobile"
  >
    <a
      *ngFor="let link of navLinks"
      [routerLink]="link.path"
      routerLinkActive="is-active"
      (click)="closeMobileMenu()"
    >
      {{ link.label }}
    </a>
    <a href="tel:+919023424923" class="header__mobile-phone" (click)="closeMobileMenu()">
      <lucide-icon name="phone" [size]="16"></lucide-icon>
      +91 90234 24923
    </a>
    <div class="header__mobile-actions">
      <a routerLink="/login" class="btn btn-outline" (click)="closeMobileMenu()">Login</a>
      <a routerLink="/contact" class="btn btn-primary" (click)="closeMobileMenu()">Get a Quote</a>
    </div>
  </nav>
</header>
