<section class="hero">
  <img
    class="hero__bg"
    src="https://images.unsplash.com/photo-1626446644149-92e5039b74f0?auto=format&fit=crop&w=1920&q=80"
    srcset="
      https://images.unsplash.com/photo-1626446644149-92e5039b74f0?auto=format&fit=crop&w=800&q=80 800w,
      https://images.unsplash.com/photo-1626446644149-92e5039b74f0?auto=format&fit=crop&w=1280&q=80 1280w,
      https://images.unsplash.com/photo-1626446644149-92e5039b74f0?auto=format&fit=crop&w=1920&q=80 1920w,
      https://images.unsplash.com/photo-1626446644149-92e5039b74f0?auto=format&fit=crop&w=2560&q=80 2560w,
      https://images.unsplash.com/photo-1626446644149-92e5039b74f0?auto=format&fit=crop&w=3840&q=80 3840w
    "
    sizes="100vw"
    alt=""
    fetchpriority="high"
  />
  <div class="hero__scrim"></div>
  <div class="hero__overlay"></div>

  <div class="container hero__content">
    <p class="hero__eyebrow">SAFE &bull; RELIABLE &bull; ON TIME, EVERY TRIP</p>
    <h1 class="hero__heading">
      Trusted Transport Partner for a
      <span class="hero__highlight">Stronger Tomorrow</span>
    </h1>
    <p class="hero__description">
      We deliver your goods safely, on time, and with complete transparency. From small consignments
      to full truck loads, we keep your business moving.
    </p>

    <div class="hero__ctas">
      <a href="#contact" class="btn btn-primary">
        Get in Touch
        <lucide-icon name="arrow-right" [size]="18"></lucide-icon>
      </a>
      <a href="tel:+919023424923" class="btn btn-secondary">
        <lucide-icon name="phone" [size]="18"></lucide-icon>
        Call Us Now
      </a>
    </div>

    <ul class="hero__trust">
      <li *ngFor="let item of trustIndicators">
        <lucide-icon [name]="item.icon" [size]="18"></lucide-icon>
        <span>{{ item.label }}</span>
      </li>
    </ul>
  </div>

  <a href="#services" class="hero__scroll-cue" aria-label="Scroll to explore our services">
    <lucide-icon name="chevron-down" [size]="22"></lucide-icon>
  </a>
</section>
